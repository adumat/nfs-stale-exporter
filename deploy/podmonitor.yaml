---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nfs-stale-exporter
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: nfs-stale-exporter}
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      # prometheus-operator's default relabelings do NOT map the node name, so
      # without this every per-node metric and alert is anonymous.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
