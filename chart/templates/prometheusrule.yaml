{{- if .Values.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "nfs-stale-exporter.fullname" . }}
  labels:
    {{- include "nfs-stale-exporter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  groups:
    - name: nfs-stale-exporter.rules
      rules:
{{- if .Values.prometheusRule.recordingRules }}
        # Requires kube-state-metrics to expose the pod label:
        #   metricLabelsAllowlist: ["pods={{ printf "[%s]" .Values.prometheusRule.appLabel }}"]
        # Verify this returns one series per NFS app before relying on it. An
        # empty result looks exactly like a healthy cluster.
        - record: nfs:mount_stale:app
          expr: |-
            max by (namespace, app) (
              {{ include "nfs-stale-exporter.staleJoin" . | nindent 14 | trim }}
            )
        # Every app that HAS an NFS mount, regardless of health. Used to detect
        # apps with no recovery configured.
        - record: nfs:mount_present:app
          expr: |-
            max by (namespace, app) (
              {{ include "nfs-stale-exporter.staleJoin" . | nindent 14 | trim }}
            ) >= bool 0
{{- end }}
{{- if .Values.prometheusRule.alerts.stale.enabled }}
        # Expected to self-resolve once recovery bounces the pod.
        - alert: NfsMountStale
          expr: nfs:mount_stale:app == 1
          for: {{ .Values.prometheusRule.alerts.stale.for }}
          labels:
            severity: {{ .Values.prometheusRule.alerts.stale.severity }}
          annotations:
            summary: {{ `{{ $labels.app }} has a stale NFS mount` | quote }}
            description: {{ `The NFS mount for {{ $labels.app }} in {{ $labels.namespace }} is returning errors. The pod will keep reporting Ready regardless.` | quote }}
{{- end }}
{{- if .Values.prometheusRule.alerts.unrecovered.enabled }}
        # The one worth paging on: recovery had its chance and did not work.
        - alert: NfsMountStaleUnrecovered
          expr: nfs:mount_stale:app == 1
          for: {{ .Values.prometheusRule.alerts.unrecovered.for }}
          labels:
            severity: {{ .Values.prometheusRule.alerts.unrecovered.severity }}
          annotations:
            summary: {{ `{{ $labels.app }} stale NFS mount was not recovered automatically` | quote }}
            description: {{ `Still stale well past the grace period. Recovery is not configured for this app, or it ran and failed. Recover manually with: kubectl delete pod -n {{ $labels.namespace }} -l app={{ $labels.app }}` | quote }}
{{- end }}
{{- if .Values.prometheusRule.alerts.noMounts.enabled }}
        # A blind exporter is indistinguishable from a healthy cluster, so this
        # is the alert that keeps the other two honest.
        - alert: NfsExporterSeesNoMounts
          expr: nfs_mounts_discovered == 0 and nfs_mounts_unreachable > 0
          for: {{ .Values.prometheusRule.alerts.noMounts.for }}
          labels:
            severity: {{ .Values.prometheusRule.alerts.noMounts.severity }}
          annotations:
            summary: {{ `nfs-stale-exporter probed no mounts on {{ $labels.node }}` | quote }}
            description: {{ `The host mount table lists NFS mounts but none could be probed. Usually a missing mountPropagation: HostToContainer, or a kubeletDir that does not match this distro.` | quote }}
{{- end }}
{{- with .Values.prometheusRule.extraRules }}
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
